# LoRA-adapt the FLUX.2 Klein VAE's encoder (decoder frozen) with a JEPA-style
# blur-context / GT-latent-target objective. See papers/main.tex Sec. 5/6 and
# models/reFlux/VAEBlurAlign_model.py for the design rationale.
#
# Run a short smoke test first (max_train_steps small) before a real launch:
#   python trainer.py -opt checkpoints/reFlux/VAEBlurAlign.yml -test

name: Motion
model_type: VAEBlurAlign_model
tracker_project_name: Motion
experiment_key: VAEBlurAlign

is_train: true
report_to: comet_ml
push_to_hub: false
num_gpu: 1
seed: 42
mixed_precision: bf16
allow_tf32: true

pretrained_model_name_or_path: black-forest-labs/FLUX.2-klein-4B
revision: ~
variant: ~

lora_rank: 128
latent_loss_weight: 5.0
pixel_loss_weight: 1.0
gan_loss_weight: 0.0  # GAN loss disabled: 3 full-length attempts (default, reduced weight, reduced weight + weakened D) all finished with block-region output worse than doing nothing, no improvement even after D stabilized -- see model docstring
gan_mode: hinge

datasets:
  train:
    # FullResPatchifierDataset (not FullResBlurDataset): yields REAL stacked
    # batches by loading `batch_size` full-res images once and drawing
    # `patches_per_group` different (shared-shape) crops from them before
    # moving on -- see the file's docstring for why FullResBlurDataset's
    # per-sample random aspect ratio made real batching crash (val.batch_size
    # > 1 hit "stack expects each tensor to be equal size" in practice).
    type: FullResPatchifierDataset
    data_dir: /depot/chan129/data/Deblur_MIOR/train
    gt_folder: gt
    lq_folder: blur
    is_train: true
    crop_size: 512
    # Measured directly on this GPU (memcheck_batch.py probe, same
    # encode/decode/loss path as optimize_parameters): batch=64 peaks at
    # ~41.9GB allocated / ~49.1GB reserved -- ~31GB headroom on an 80GB card.
    # This arm runs on its OWN dedicated GPU (k004), the fullblur baseline on
    # a separate one (k050), rather than sharing one GPU between both jobs:
    # sharing meant both competing for the same compute (100% util either
    # way), not just memory, so splitting across two GPUs removes that
    # contention entirely instead of merely fitting both in one card's
    # memory. batch=96 was tested too (~62.7GB reserved, ~17GB headroom) but
    # left less margin than felt safe for an unattended multi-hour run given
    # real training's variable crop aspect ratios vs. this probe's fixed
    # 512x512 shape.
    batch_size: 64
    patches_per_group: 10
    # Reject block placements whose blur-vs-GT signal is weaker than the
    # frozen VAE's own decode(encode(x)) round-trip noise (~0.0005-0.0019 MSE
    # measured directly) -- below that, no trained encoder can ever beat the
    # "do nothing" floor, since the round trip alone costs more than the blur
    # did. See dataset/fullres_patchifier_dataset.py's docstring/comments.
    min_block_floor_mse: 0.002
    max_block_resample_attempts: 20
    split_range: [0, 98]
    num_worker_per_gpu: 4

  val:
    type: FullResPatchifierDataset
    data_dir: /depot/chan129/data/Deblur_MIOR/train
    gt_folder: gt
    lq_folder: blur
    is_train: false
    crop_size: 512
    batch_size: 4
    patches_per_group: 1
    min_block_floor_mse: 0.002
    max_block_resample_attempts: 20
    split_range: [98, 100]
    num_worker_per_gpu: 0

path:
  root: /scratch/gilbreth/wweligam/experiments
  logging_dir: logs
  resume_from_checkpoint: ~

train:
  lora_finetune: true
  optim:
    type: adamw
    scale_lr: false
    learning_rate: 5e-4
    # 0.1x the generator's LR -- the first GAN run collapsed (D loss ->0.3,
    # G's adversarial loss ->2.0+, monotonic the whole 750 steps, block-region
    # pixel error measurably worse at the end than at step 300) with D and G
    # at the SAME LR. Weakening D directly, on top of the already-reduced
    # gan_loss_weight below, is the retry.
    discriminator_learning_rate: 5e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_weight_decay: 0.01
    adam_epsilon: 1e-8
    max_grad_norm: 1.0
  scheduler:
    type: constant
    lr_warmup_steps: 15
    lr_num_cycles: 1
    lr_power: 1.0
  # batch_size raised 4->64 to use the GPU's actual headroom (see
  # datasets.train.batch_size above) -- gradient_accumulation_steps can't go
  # below 1, so this necessarily raises the effective batch from 16 to 64
  # (was batch_size=4 * grad_accum=4). That's an intentional side effect of
  # maximizing real (parallel) batch size, not a separate deliberate
  # experiment change -- LR is left as-is rather than also applying the
  # linear-scaling-rule bump, to keep this a single-variable change.
  # max_train_steps unchanged means ~4x more total images seen over the run
  # than the batch=4/grad_accum=4 config (64 vs 16 images per optimizer
  # step), which given the extra parallelism should still be faster in
  # wall-clock terms, not slower.
  gradient_accumulation_steps: 1
  # max_train_steps/validation_steps/checkpointing_steps scaled 8x (750->6000
  # etc.) for a real convergence run, now that batch_size=64 gives by far the
  # cleanest loss trend of the investigation (r=-0.66 at step 300, vs -0.28
  # for the best prior config) -- the 750-step budget was sized for fast
  # iteration between architecture fixes, not for judging real convergence.
  # Safe to edit while the current 750-step run is still in flight: OmegaConf
  # is loaded once at process start, never re-read from disk mid-run.
  num_train_epochs: 150
  batch_size: 64
  max_train_steps: 6000
  validation_steps: 200
  checkpointing_steps: 600
  checkpoints_total_limit: 3
  patched: false
  check_speed: false

val:
  save_images: true
  batch_size: 4  # not read for FullResPatchifierDataset -- see datasets.val.batch_size
  max_val_steps: 8
  metrics:
    # ssim intentionally omitted: utils/misc.py's log_metrics passes
    # calculate_ssim's (value, map) tuple straight to tracker.add_scalar,
    # which crashes -- no config anywhere else in this repo uses it either.
    psnr:
      crop: 30
    mse:
      crop: 30
