# X8: NAFNet regression baseline on Deblur_MIOR, trained from scratch. The original
# Motion/NAFNet_2026_02_13_16_23_59 checkpoint was destroyed by the scratch 45-day purge
# (0 weight files survive, only empty checkpoint-dir skeletons) -- this is a full retrain
# at the same scale (~50K steps) rather than an eval of a surviving checkpoint.

name: Motion
model_type: Simple_model
tracker_project_name: Motion
experiment_key: NAFNet_deblur_mior

is_train: true
report_to: tensorboard
push_to_hub: false
num_gpu: 1
seed: 10
mixed_precision: !!str no
allow_tf32: true

datasets:
  train:
    type: HuggingFaceDataset
    name: /depot/chan129/data/Deblur_MIOR/
    split: train
    trust_remote_code: true
    repeat: 4
    num_proc: 16
    map_batch_size: 16
    use_shuffle: true
    gt_key: gt
    lq_key: blur
    common_transforms_keys: [gt, blur]
    transforms:
      to_tensor:
      crop_random:
        h: 512
        w: 512
      normalize:
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]

  val:
    type: HuggingFaceDataset
    name: /depot/chan129/data/Deblur_MIOR/
    split: validation
    trust_remote_code: true
    use_shuffle: false
    gt_key: gt
    lq_key: blur
    common_transforms_keys: [gt, blur]
    transforms:
      to_tensor:
      crop:
        h: 512
        w: 512
      normalize:
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]

network:
  type: NAFNet
  in_channels: 3
  out_channels: 3
  width: 32
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]

path:
  root: /scratch/gilbreth/wweligam/experiments
  logging_dir: logs
  resume_from_path: ~
  resume_from_checkpoint: ~

train:
  optim:
    scale_lr: false
    use_8bit_adam: false
    learning_rate: !!float 2e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_weight_decay: 0.01
    adam_epsilon: !!float 1e-8
    max_grad_norm: 1.0

  scheduler:
    type: cosine_with_restarts
    lr_warmup_steps: 500
    lr_num_cycles: 3
    lr_power: 1.0

  loss: 1*PSNR_loss
  gradient_accumulation_steps: 1
  num_train_epochs: 50
  batch_size: 8

  max_train_steps: 50000
  validation_steps: 2000
  checkpointing_steps: 2000
  checkpoints_total_limit: 3

  patched: false
  patch_size_h: 256
  patch_size_w: 256
  patch_overlap: 0.2
  max_minibatch: 8

val:
  save_images: true
  patched: false
  patch_size_h: 256
  patch_size_w: 256
  patch_overlap: 0.2
  max_minibatch: 8
  batch_size: 1
  max_val_steps: 10

  metrics:
    psnr:
      crop: 30
    mse:
      crop: 30
