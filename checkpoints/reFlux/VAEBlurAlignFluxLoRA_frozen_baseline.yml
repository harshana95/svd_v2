# Baseline for VAEBlurAlignFluxLoRA.yml: run FLUX.2 Klein's transformer
# COMPLETELY FROZEN (lora_rank: 0, no fine-tuning at all) with the same
# phase-1 trained cond_vae conditioning tokens, to isolate how much the
# rank-128 LoRA fine-tuning in VAEBlurAlignFluxLoRA.yml actually contributes
# beyond FLUX2's own pretrained generative prior + a good conditioning signal.
#
# is_train: false -- base_model.py's train() skips the epoch loop entirely
# when is_train is false (num_train_epochs forced to 0) and falls straight
# through to one final self.validation() call, so this just runs a single
# evaluation pass over datasets.val and reports metrics/images. Nothing is
# trained (setup_optimizers() is never even called when is_train=false), so
# there's no optimizer/scheduler config here worth setting.
#
#   python trainer.py -opt checkpoints/reFlux/VAEBlurAlignFluxLoRA_frozen_baseline.yml -infer

name: Motion
model_type: VAEBlurAlignFluxLoRA_model
tracker_project_name: Motion
experiment_key: VAEBlurAlignFluxLoRA_frozen_baseline

is_train: false
report_to: comet_ml
push_to_hub: false
num_gpu: 1
seed: 42
mixed_precision: bf16
allow_tf32: true

pretrained_model_name_or_path: black-forest-labs/FLUX.2-klein-4B
revision: ~
variant: ~

guidance_scale: 1.0
discrete_flow_shift: 3.1582
transformer_gradient_checkpointing: false  # nothing trains, no backward pass -- not needed

# Same phase-1 encoder as the LoRA run, so the ONLY variable vs.
# VAEBlurAlignFluxLoRA.yml is whether the transformer itself was fine-tuned.
vae_checkpoint_path: /scratch/gilbreth/wweligam/experiments/Motion/VAEBlurAlign_2026_08_31_15_07_57/checkpoint-6000/AutoencoderKLFlux2_1
vae_lora_rank: 128
vae_trainable: false

datasets:
  train:
    # Present only because BaseModel.setup_dataloaders() always builds both
    # loaders; is_train=false means the train loader is never actually
    # iterated. A tiny split keeps dataset init itself cheap.
    type: FullResPatchifierDataset
    data_dir: /depot/chan129/data/Deblur_MIOR/train
    gt_folder: gt
    lq_folder: blur
    is_train: true
    crop_size: 512
    batch_size: 4
    patches_per_group: 1
    min_block_floor_mse: 0.002
    max_block_resample_attempts: 20
    split_range: [0, 1]
    num_worker_per_gpu: 0

  val:
    type: FullResPatchifierDataset
    data_dir: /depot/chan129/data/Deblur_MIOR/train
    gt_folder: gt
    lq_folder: blur
    is_train: false
    crop_size: 512
    batch_size: 4
    patches_per_group: 1
    min_block_floor_mse: 0.002
    max_block_resample_attempts: 20
    split_range: [98, 100]
    num_worker_per_gpu: 0

path:
  root: /scratch/gilbreth/wweligam/experiments
  logging_dir: logs
  resume_from_checkpoint: ~

train:
  lora_rank: 0  # <-- the whole point of this config: no LoRA, transformer stays frozen
  optim:
    type: adamw
    scale_lr: false
    learning_rate: 1e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_weight_decay: 0.01
    adam_epsilon: 1e-8
    max_grad_norm: 1.0
  scheduler:
    type: constant
    lr_warmup_steps: 1
    lr_num_cycles: 1
    lr_power: 1.0
  gradient_accumulation_steps: 1
  num_train_epochs: 1  # forced to 0 internally anyway since is_train=false
  batch_size: 4
  max_train_steps: 1
  validation_steps: 1
  checkpointing_steps: 1000000
  checkpoints_total_limit: 1
  patched: false
  check_speed: false

val:
  save_images: true
  num_inference_steps: 28
  batch_size: 4  # not read for FullResPatchifierDataset -- see datasets.val.batch_size
  # Larger than the periodic-sanity-check value used during actual training
  # runs -- this run's whole purpose is a real evaluation, not a quick check.
  max_val_steps: 40
  metrics:
    psnr:
      crop: 30
    mse:
      crop: 30
