# Third-arm ablation for the VAEBlurAlign investigation: "simple" FLUX.2 LoRA
# baseline with NO trained encoder and NO JEPA/DINO/CLIP machinery at all --
# reuses the existing models/LucidFlux/Flux2KleinLoRA_model.py, whose own
# docstring is "Flux2 Klein LoRA trainer without JEPA conditioning."
# Encoder = plain frozen FLUX.2 VAE, "unet" = FLUX.2 transformer (LoRA-
# trained), decoder = the same plain frozen VAE. The condition image's own
# VAE-latent tokens are concatenated into hidden_states (Pattern A) exactly
# like VAEBlurAlignFluxLoRA -- the only real difference from Phase 2 is that
# those tokens come from the plain untouched VAE instead of the Phase-1
# trained encoder.
#
# (An earlier attempt reused models/reFlux/ContextFluxBaseline_model.py with
# every V-JEPA/DINO/CLIP toggle set to false, which technically works but
# needlessly drags in JEPA-adjacent code paths -- and one of them had a
# latent bug (see models/reFlux/ContextFluxBaseline_model.py's opt.get()
# fix). This config uses the actually-minimal model instead.)
#
# Dataset/optimizer/LoRA/schedule hyperparameters are matched 1:1 to
# VAEBlurAlignFluxLoRA.yml (Phase 2) so the only real variable between the
# two runs is "does the Phase-1 trained VAE-encoder conditioning beat
# conditioning through the plain frozen VAE?"
#
# Run a short smoke test first:
#   python trainer.py -opt checkpoints/reFlux/Flux2KleinLoRA_SimpleBaseline_smoke.yml -test

name: Motion
model_type: Flux2KleinLoRA_model
tracker_project_name: Motion
experiment_key: Flux2KleinLoRA_SimpleBaseline

is_train: true
report_to: comet_ml
push_to_hub: false
num_gpu: 1
seed: 42
mixed_precision: bf16
allow_tf32: true

pretrained_model_name_or_path: black-forest-labs/FLUX.2-klein-4B
revision: ~
variant: ~

guidance_scale: 1.0
discrete_flow_shift: 3.1582
transformer_gradient_checkpointing: true
precomputed_embeddings_path: /home/wweligam/svd_v2/playground/null_prompt_embeddings_flux2_klein.pt

datasets:
  train:
    type: FullResPatchifierDataset
    data_dir: /depot/chan129/data/Deblur_MIOR/train
    gt_folder: gt
    lq_folder: blur
    is_train: true
    crop_size: 512
    batch_size: 32
    patches_per_group: 10
    min_block_floor_mse: 0.002
    max_block_resample_attempts: 20
    split_range: [0, 98]
    num_worker_per_gpu: 4

  val:
    type: FullResPatchifierDataset
    data_dir: /depot/chan129/data/Deblur_MIOR/train
    gt_folder: gt
    lq_folder: blur
    is_train: false
    crop_size: 512
    batch_size: 4
    patches_per_group: 1
    min_block_floor_mse: 0.002
    max_block_resample_attempts: 20
    split_range: [98, 100]
    num_worker_per_gpu: 0

path:
  root: /scratch/gilbreth/wweligam/experiments
  logging_dir: logs
  resume_from_checkpoint: ~

train:
  lora_rank: 128
  lora_alpha: 256
  lora_dropout: 0.0

  optim:
    type: adamw
    scale_lr: false
    learning_rate: 1e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_weight_decay: 0.01
    adam_epsilon: 1e-8
    max_grad_norm: 1.0

  scheduler:
    type: constant_with_warmup
    lr_warmup_steps: 500
    lr_num_cycles: 1
    lr_power: 1.0

  gradient_accumulation_steps: 1
  num_train_epochs: 150
  batch_size: 32
  max_train_steps: 20000
  validation_steps: 200
  checkpointing_steps: 500
  checkpoints_total_limit: 3
  patched: false
  check_speed: false

val:
  save_images: true
  num_inference_steps: 28
  batch_size: 4  # not read for FullResPatchifierDataset -- see datasets.val.batch_size
  max_val_steps: 8
  metrics:
    psnr:
      crop: 30
    mse:
      crop: 30
