# Baseline for VAEBlurAlign.yml: full-resolution blur -> GT, NO patching.
# Identical model/dataset/training setup, with one difference -- the
# "replaced block" is forced to cover the entire crop (replace_ratio=1.0,
# aspect=1.0 so clipping can't leave a sliver of GT context on one edge), so
# every position is corrupted and none of the input is clean context. This
# reuses FullResBlurDataset/VAEBlurAlign_model unmodified: full-frame blur is
# the ratio=1.0 special case of the same block-replacement mechanism, not a
# separate code path -- there's nothing here that could silently diverge from
# the patched config other than this one setting.
#
# This is the ablation the patched run (VAEBlurAlign.yml) needs to beat: does
# giving the encoder clean surrounding context to condition on (the actual
# JEPA-style mechanism) do better than deblurring with no clean reference at
# all in the frame? Same loss weights, same LoRA rank, same schedule -- the
# only variable is patched vs. full-frame corruption.
#
# Run a short smoke test first (max_train_steps small) before a real launch:
#   python trainer.py -opt checkpoints/reFlux/VAEBlurAlign_fullblur_baseline_smoke.yml -test

name: Motion
model_type: VAEBlurAlign_model
tracker_project_name: Motion
experiment_key: VAEBlurAlign_fullblur_baseline

is_train: true
report_to: comet_ml
push_to_hub: false
num_gpu: 1
seed: 42
mixed_precision: bf16
allow_tf32: true

pretrained_model_name_or_path: black-forest-labs/FLUX.2-klein-4B
revision: ~
variant: ~

lora_rank: 128
latent_loss_weight: 5.0
pixel_loss_weight: 1.0
gan_loss_weight: 0.0  # GAN loss disabled: 3 full-length attempts (default, reduced weight, reduced weight + weakened D) all finished with block-region output worse than doing nothing, no improvement even after D stabilized -- see model docstring
gan_mode: hinge

datasets:
  train:
    # FullResPatchifierDataset -- see VAEBlurAlign.yml for why (real stacked
    # batches; FullResBlurDataset's per-sample random aspect ratio crashes
    # collation once batch_size > 1).
    type: FullResPatchifierDataset
    data_dir: /depot/chan129/data/Deblur_MIOR/train
    gt_folder: gt
    lq_folder: blur
    is_train: true
    crop_size: 512
    batch_size: 4
    patches_per_group: 10
    replace_ratio_min: 1.0
    replace_ratio_max: 1.0
    block_aspect_min: 1.0
    block_aspect_max: 1.0
    split_range: [0, 98]
    num_worker_per_gpu: 4

  val:
    type: FullResPatchifierDataset
    data_dir: /depot/chan129/data/Deblur_MIOR/train
    gt_folder: gt
    lq_folder: blur
    is_train: false
    crop_size: 512
    batch_size: 4
    patches_per_group: 1
    replace_ratio_min: 1.0
    replace_ratio_max: 1.0
    block_aspect_min: 1.0
    block_aspect_max: 1.0
    split_range: [98, 100]
    num_worker_per_gpu: 0

path:
  root: /scratch/gilbreth/wweligam/experiments
  logging_dir: logs
  resume_from_checkpoint: ~

train:
  lora_finetune: true
  optim:
    type: adamw
    scale_lr: false
    learning_rate: 5e-4
    # See VAEBlurAlign.yml for why this is 0.1x the generator's LR (the first
    # GAN run collapsed with D and G at matched LR).
    discriminator_learning_rate: 5e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_weight_decay: 0.01
    adam_epsilon: 1e-8
    max_grad_norm: 1.0
  scheduler:
    type: constant
    lr_warmup_steps: 15
    lr_num_cycles: 1
    lr_power: 1.0
  # See VAEBlurAlign.yml for why this is batch_size=4 (real, via
  # FullResPatchifierDataset) * gradient_accumulation_steps=4 = effective 16.
  gradient_accumulation_steps: 4
  num_train_epochs: 150
  batch_size: 4
  max_train_steps: 750
  validation_steps: 25
  checkpointing_steps: 75
  checkpoints_total_limit: 3
  patched: false
  check_speed: false

val:
  save_images: true
  batch_size: 4  # not read for FullResPatchifierDataset -- see datasets.val.batch_size
  max_val_steps: 8
  metrics:
    # ssim intentionally omitted: utils/misc.py's log_metrics passes
    # calculate_ssim's (value, map) tuple straight to tracker.add_scalar,
    # which crashes -- no config anywhere else in this repo uses it either.
    psnr:
      crop: 30
    mse:
      crop: 30
